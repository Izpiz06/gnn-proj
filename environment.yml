name: genome_code
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://data.dgl.ai/wheels/torch-2.2/cu121/repo.html
      - torch==2.2.2+cu121
      - torchvision==0.17.2+cu121
      - torchaudio==2.2.2+cu121
      - torchdata==0.7.1
      - numpy<2.0,>=1.26.4
      - dgl==2.4.0+cu121
      - transformers==4.35.2
      - accelerate>=0.24.0
      - datasets>=2.14.0
      - einops>=0.7.0
      - cooler>=0.10.0
      - biopython>=1.80
      - bitsandbytes==0.43.3
      - matplotlib>=3.8.0
      - scikit-learn>=1.3.0
      - ipykernel
